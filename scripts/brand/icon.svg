<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
  </defs>
  <!-- Home Keeper IPP brand icon. Drawn from scratch for this project (no template or
       third-party artwork): a printer whose body shows four cartridge levels, one of
       them low. See scripts/brand/README.md. -->
  <!-- paper tray -->
  <rect x="70" y="18" width="116" height="58" rx="10" fill="url(#g)"/>
  <!-- printer body -->
  <rect x="16" y="66" width="224" height="132" rx="28" fill="url(#g)"/>
  <!-- cartridge levels: track and fill -->
  <g fill="#ffffff">
    <rect x="52" y="96" width="26" height="72" rx="8" fill-opacity="0.35"/>
    <rect x="52" y="112" width="26" height="56" rx="8"/>
    <rect x="94" y="96" width="26" height="72" rx="8" fill-opacity="0.35"/>
    <rect x="94" y="124" width="26" height="44" rx="8"/>
    <rect x="136" y="96" width="26" height="72" rx="8" fill-opacity="0.35"/>
    <rect x="136" y="104" width="26" height="64" rx="8"/>
    <rect x="178" y="96" width="26" height="72" rx="8" fill-opacity="0.35"/>
    <rect x="178" y="152" width="26" height="16" rx="8"/>
  </g>
  <!-- paper out -->
  <rect x="62" y="186" width="132" height="54" rx="8" fill="#ffffff" stroke="url(#g)" stroke-width="10"/>
  <rect x="84" y="206" width="88" height="8" rx="4" fill="#4FC3F7"/>
</svg>
