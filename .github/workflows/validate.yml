name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tests run against this release of Home Keeper (its test fake and the real
  # integration). Keep it in step with the version users run.
  HOME_KEEPER_REF: v0.32.0

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Fetch Home Keeper for the integration tests
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch "$HOME_KEEPER_REF" \
            https://github.com/prestomation/ha-home-keeper.git "$RUNNER_TEMP/home-keeper"
          cp -r "$RUNNER_TEMP/home-keeper/custom_components/home_keeper" custom_components/
          # Home Keeper's own requirements, and the frontend it depends on
          constraints="$(python -c 'import homeassistant, pathlib; print(pathlib.Path(homeassistant.__file__).parent / "package_constraints.txt")')"
          jq -r '.requirements[]' custom_components/home_keeper/manifest.json > hk-requirements.txt
          grep -i '^home-assistant-frontend==' "$constraints" >> hk-requirements.txt
          pip install -r hk-requirements.txt -c "$constraints"
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest.log
      - name: Report pytest output
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 60 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=pytest output::${msg}"
